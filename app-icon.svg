<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <!-- 橘金色漸層 (圖形用) -->
        <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24" />
            <stop offset="100%" stop-color="#ea580c" />
        </linearGradient>
        <!-- 深邃曜石黑漸層 (背景用) -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e293b" />
            <stop offset="100%" stop-color="#020617" />
        </linearGradient>
        <!-- 微微發光效果 -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- 圓角背景 (仿 Apple iOS 圓角) -->
    <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
    
    <!-- 內部圖形：房屋與地圖標記 -->
    <g transform="translate(128, 128)" fill="none" stroke="url(#iconGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
        <!-- 房屋屋頂 -->
        <path d="M 0 136 L 128 24 L 256 136" />
        <!-- 房屋主體 -->
        <path d="M 40 100 L 40 240 C 40 248.8 47.2 256 56 256 L 200 256 C 208.8 256 216 248.8 216 240 L 216 100" />
        <!-- 內嵌地圖定位針 (Map Pin) -->
        <path d="M 128 100 A 32 32 0 1 0 128 164 A 32 32 0 1 0 128 100 Z" />
        <path d="M 128 164 L 128 210" />
    </g>
</svg>